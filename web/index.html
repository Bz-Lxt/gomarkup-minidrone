<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>MiniDrone · 轻量级 CI/CD</title>
<style>
:root {
  --bg: #0d1117;
  --panel: #161b22;
  --panel-2: #1c2330;
  --border: #30363d;
  --text: #e6edf3;
  --text-dim: #8b949e;
  --accent: #58a6ff;
  --green: #3fb950;
  --red: #f85149;
  --orange: #d29922;
  --gray: #8b949e;
  --mono: ui-monospace, SFMono-Regular, "SF Mono", Menlo, Consolas, monospace;
}
* { box-sizing: border-box; margin: 0; padding: 0; }
body {
  background: var(--bg); color: var(--text);
  font: 14px/1.5 -apple-system, BlinkMacSystemFont, "Segoe UI", "PingFang SC", "Microsoft YaHei", sans-serif;
  min-height: 100vh;
}
a { color: var(--accent); text-decoration: none; }
button { cursor: pointer; font: inherit; }

/* ---- 顶栏 ---- */
header {
  display: flex; align-items: center; gap: 16px;
  padding: 0 24px; height: 56px;
  background: var(--panel); border-bottom: 1px solid var(--border);
  position: sticky; top: 0; z-index: 10;
}
.logo { display: flex; align-items: center; gap: 10px; font-weight: 700; font-size: 16px; }
.logo svg { display: block; }
.logo span em { color: var(--accent); font-style: normal; }
nav { display: flex; gap: 4px; margin-left: 12px; }
nav a {
  color: var(--text-dim); padding: 6px 12px; border-radius: 6px; font-size: 13px;
}
nav a.active, nav a:hover { color: var(--text); background: var(--panel-2); }
.health { margin-left: auto; display: flex; align-items: center; gap: 6px; color: var(--text-dim); font-size: 12px; }
.health .dot { width: 8px; height: 8px; border-radius: 50%; background: var(--gray); }
.health.ok .dot { background: var(--green); }

/* ---- 布局 ---- */
main { max-width: 1200px; margin: 0 auto; padding: 24px; }
.page-title { font-size: 18px; font-weight: 600; margin-bottom: 16px; display: flex; align-items: center; gap: 12px; }
.page-title .spacer { flex: 1; }

/* ---- 卡片与表格 ---- */
.card { background: var(--panel); border: 1px solid var(--border); border-radius: 8px; }
table { width: 100%; border-collapse: collapse; }
th, td { text-align: left; padding: 10px 14px; border-bottom: 1px solid var(--border); font-size: 13px; }
th { color: var(--text-dim); font-weight: 500; font-size: 12px; }
tr:last-child td { border-bottom: none; }
tbody tr { cursor: pointer; }
tbody tr:hover { background: var(--panel-2); }

/* ---- 状态徽章 ---- */
.badge {
  display: inline-flex; align-items: center; gap: 6px;
  padding: 2px 10px; border-radius: 999px; font-size: 12px; font-weight: 500;
  border: 1px solid transparent; white-space: nowrap;
}
.badge::before { content: ""; width: 7px; height: 7px; border-radius: 50%; background: currentColor; }
.badge.pending  { color: var(--gray);   border-color: var(--gray); }
.badge.running  { color: var(--accent); border-color: var(--accent); }
.badge.running::before { animation: pulse 1.1s ease-in-out infinite; }
.badge.success  { color: var(--green);  border-color: var(--green); }
.badge.failed   { color: var(--red);    border-color: var(--red); }
.badge.skipped  { color: var(--gray);   border-color: var(--border); opacity: .7; }
.badge.canceled { color: var(--orange); border-color: var(--orange); }
@keyframes pulse { 50% { opacity: .25; } }

/* ---- 按钮 ---- */
.btn {
  background: var(--panel-2); color: var(--text);
  border: 1px solid var(--border); border-radius: 6px;
  padding: 5px 14px; font-size: 13px;
}
.btn:hover { border-color: var(--text-dim); }
.btn.primary { background: #1f6feb; border-color: #1f6feb; color: #fff; }
.btn.primary:hover { background: #388bfd; }
.btn.danger { color: var(--red); }
.btn:disabled { opacity: .5; cursor: not-allowed; }

/* ---- 流水线卡片 ---- */
.pipeline-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(320px, 1fr)); gap: 16px; }
.pipeline-card { padding: 16px; }
.pipeline-card h3 { font-size: 15px; margin-bottom: 8px; display: flex; align-items: center; gap: 8px; }
.pipeline-card .meta { color: var(--text-dim); font-size: 12px; margin-bottom: 12px; }
.pipeline-card .meta code { background: var(--panel-2); padding: 1px 6px; border-radius: 4px; font-family: var(--mono); font-size: 11px; }
.pipeline-card .stages-flow { display: flex; flex-wrap: wrap; gap: 6px; margin-bottom: 14px; }
.chip { background: var(--panel-2); border: 1px solid var(--border); border-radius: 4px; padding: 2px 8px; font-size: 11px; color: var(--text-dim); font-family: var(--mono); }

/* ---- 构建详情 ---- */
.build-head { display: flex; align-items: center; gap: 12px; flex-wrap: wrap; margin-bottom: 20px; }
.build-head h2 { font-size: 17px; font-family: var(--mono); }
.build-head .meta { color: var(--text-dim); font-size: 12px; }
.stage-flow { display: flex; gap: 0; align-items: stretch; overflow-x: auto; padding-bottom: 8px; margin-bottom: 20px; }
.stage-node { display: flex; align-items: center; }
.stage-card {
  min-width: 190px; background: var(--panel); border: 1px solid var(--border);
  border-radius: 8px; padding: 12px; cursor: default; flex-shrink: 0;
  border-top-width: 3px;
}
.stage-card.pending  { border-top-color: var(--gray); }
.stage-card.running  { border-top-color: var(--accent); }
.stage-card.success  { border-top-color: var(--green); }
.stage-card.failed   { border-top-color: var(--red); }
.stage-card.skipped  { border-top-color: var(--border); opacity: .65; }
.stage-card.canceled { border-top-color: var(--orange); }
.stage-card .stage-name { font-weight: 600; font-size: 13px; display: flex; justify-content: space-between; align-items: center; margin-bottom: 8px; }
.stage-card .dur { color: var(--text-dim); font-weight: 400; font-size: 11px; }
.step-row {
  display: flex; align-items: center; gap: 8px; padding: 6px 8px;
  border-radius: 6px; font-size: 12px; cursor: pointer; font-family: var(--mono);
}
.step-row:hover { background: var(--panel-2); }
.step-row.selected { background: var(--panel-2); outline: 1px solid var(--accent); }
.step-row .s-dot { width: 8px; height: 8px; border-radius: 50%; flex-shrink: 0; }
.step-row .s-dot.pending  { background: var(--gray); }
.step-row .s-dot.running  { background: var(--accent); animation: pulse 1.1s infinite; }
.step-row .s-dot.success  { background: var(--green); }
.step-row .s-dot.failed   { background: var(--red); }
.step-row .s-dot.skipped  { background: var(--border); }
.step-row .s-dot.canceled { background: var(--orange); }
.step-row .exit { margin-left: auto; color: var(--text-dim); font-size: 11px; }
.stage-arrow { color: var(--border); font-size: 18px; padding: 0 8px; flex-shrink: 0; user-select: none; }

/* ---- 日志终端 ---- */
.log-panel { background: #010409; border: 1px solid var(--border); border-radius: 8px; overflow: hidden; }
.log-head {
  display: flex; align-items: center; gap: 10px; padding: 8px 14px;
  background: var(--panel); border-bottom: 1px solid var(--border);
  font-size: 12px; color: var(--text-dim); font-family: var(--mono);
}
.log-body {
  padding: 12px 14px; font-family: var(--mono); font-size: 12px; line-height: 1.7;
  max-height: 480px; overflow: auto; white-space: pre-wrap; word-break: break-all;
  color: #c9d1d9;
}
.log-empty { color: var(--text-dim); padding: 24px; text-align: center; font-size: 13px; }

/* ---- 弹窗 ---- */
.modal-mask {
  position: fixed; inset: 0; background: rgba(1,4,9,.7);
  display: flex; align-items: center; justify-content: center; z-index: 100;
}
.modal { background: var(--panel); border: 1px solid var(--border); border-radius: 10px; width: 640px; max-width: 92vw; padding: 20px; }
.modal h3 { margin-bottom: 12px; font-size: 15px; }
.modal textarea {
  width: 100%; height: 320px; background: #010409; color: var(--text);
  border: 1px solid var(--border); border-radius: 6px; padding: 10px;
  font-family: var(--mono); font-size: 12px; resize: vertical;
}
.modal input {
  width: 100%; background: #010409; color: var(--text);
  border: 1px solid var(--border); border-radius: 6px; padding: 8px 10px;
  font-family: var(--mono); font-size: 13px; margin-bottom: 10px;
}
.modal .actions { display: flex; justify-content: flex-end; gap: 8px; margin-top: 14px; }
.modal label { display: block; font-size: 12px; color: var(--text-dim); margin-bottom: 4px; }

.empty { color: var(--text-dim); text-align: center; padding: 60px 0; font-size: 13px; }
.toast {
  position: fixed; bottom: 24px; left: 50%; transform: translateX(-50%);
  background: var(--panel-2); border: 1px solid var(--border); border-radius: 8px;
  padding: 10px 18px; font-size: 13px; z-index: 200; box-shadow: 0 8px 24px rgba(0,0,0,.5);
}
.toast.err { border-color: var(--red); color: var(--red); }
</style>
</head>
<body>

<header>
  <div class="logo">
    <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="#58a6ff" stroke-width="2" stroke-linecap="round">
      <circle cx="12" cy="12" r="3"/><path d="M12 2v4M12 18v4M2 12h4M18 12h4"/>
      <circle cx="12" cy="12" r="9" stroke-dasharray="4 3"/>
    </svg>
    <span>Mini<em>Drone</em></span>
  </div>
  <nav>
    <a href="#/" id="nav-builds">构建</a>
    <a href="#/pipelines" id="nav-pipelines">流水线</a>
  </nav>
  <div class="health" id="health"><span class="dot"></span><span id="health-text">连接中…</span></div>
</header>

<main id="main"></main>

<script>
"use strict";

const state = {
  builds: [],
  pipelines: [],
  currentBuild: null,   // 当前查看的构建快照
  selectedStep: null,   // {stage, step}
  evt: null,            // EventSource
  dashTimer: null,
  refetchTimer: null,
};

const $ = (sel) => document.querySelector(sel);
const main = $("#main");

/* ---------- 工具 ---------- */
async function api(path, opts) {
  const res = await fetch(path, opts);
  if (!res.ok) {
    let msg = res.statusText;
    try { msg = (await res.json()).error || msg; } catch {}
    throw new Error(msg);
  }
  const ct = res.headers.get("content-type") || "";
  return ct.includes("json") ? res.json() : res.text();
}

function esc(s) {
  return String(s ?? "").replace(/[&<>"']/g, c =>
    ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
}

function badge(st) { return `<span class="badge ${st}">${stateText(st)}</span>`; }

function stateText(st) {
  return {pending:"等待", running:"运行中", success:"成功", failed:"失败", skipped:"跳过", canceled:"已取消"}[st] || st;
}

function fmtTime(t) {
  if (!t || t.startsWith("0001")) return "-";
  const d = new Date(t);
  return d.toLocaleString("zh-CN", {hour12: false});
}

function fmtDur(a, b) {
  if (!a || a.startsWith("0001")) return "-";
  const start = new Date(a);
  const end = b && !b.startsWith("0001") ? new Date(b) : new Date();
  let s = Math.max(0, Math.round((end - start) / 1000));
  if (s < 60) return s + "s";
  return Math.floor(s / 60) + "m" + (s % 60) + "s";
}

function toast(msg, isErr) {
  const el = document.createElement("div");
  el.className = "toast" + (isErr ? " err" : "");
  el.textContent = msg;
  document.body.appendChild(el);
  setTimeout(() => el.remove(), 2600);
}

/* ---------- 路由 ---------- */
function router() {
  stopLive();
  const hash = location.hash || "#/";
  document.querySelectorAll("nav a").forEach(a => a.classList.remove("active"));
  if (hash.startsWith("#/builds/")) {
    $("#nav-builds").classList.add("active");
    renderBuild(hash.slice("#/builds/".length));
  } else if (hash === "#/pipelines") {
    $("#nav-pipelines").classList.add("active");
    renderPipelines();
  } else {
    $("#nav-builds").classList.add("active");
    renderDashboard();
  }
}
window.addEventListener("hashchange", router);

function stopLive() {
  if (state.evt) { state.evt.close(); state.evt = null; }
  if (state.dashTimer) { clearInterval(state.dashTimer); state.dashTimer = null; }
  if (state.refetchTimer) { clearTimeout(state.refetchTimer); state.refetchTimer = null; }
  state.currentBuild = null;
  state.selectedStep = null;
}

/* ---------- 构建看板 ---------- */
async function renderDashboard() {
  main.innerHTML = `
    <div class="page-title">最近构建<span class="spacer"></span>
      <button class="btn" onclick="renderDashboard(true)">刷新</button>
    </div>
    <div class="card"><table>
      <thead><tr>
        <th>编号</th><th>流水线</th><th>触发</th><th>分支</th><th>提交</th><th>状态</th><th>耗时</th><th>创建时间</th>
      </tr></thead>
      <tbody id="build-rows"></tbody>
    </table></div>`;
  await loadBuilds();
  state.dashTimer = setInterval(loadBuilds, 3000);
}

async function loadBuilds() {
  try {
    state.builds = await api("/api/builds");
    const tb = $("#build-rows");
    if (!tb) return;
    if (!state.builds.length) {
      tb.innerHTML = `<tr><td colspan="8"><div class="empty">还没有构建，去「流水线」页手动触发一个吧</div></td></tr>`;
      return;
    }
    tb.innerHTML = state.builds.map(b => `
      <tr onclick="location.hash='#/builds/${b.id}'">
        <td class="mono" style="font-family:var(--mono)">#${b.number}</td>
        <td>${esc(b.pipeline)}</td>
        <td>${esc(b.trigger)}</td>
        <td>${esc(b.branch || "-")}</td>
        <td style="font-family:var(--mono)">${esc((b.commit || "").slice(0, 8) || "-")}</td>
        <td>${badge(b.state)}</td>
        <td>${fmtDur(b.started_at, b.ended_at)}</td>
        <td>${fmtTime(b.created_at)}</td>
      </tr>`).join("");
  } catch (e) { /* 静默，下轮重试 */ }
}

/* ---------- 流水线管理 ---------- */
async function renderPipelines() {
  main.innerHTML = `
    <div class="page-title">流水线<span class="spacer"></span>
      <button class="btn primary" onclick="showRegisterModal()">+ 注册 YAML</button>
    </div>
    <div class="pipeline-grid" id="pl-grid"></div>`;
  try {
    state.pipelines = await api("/api/pipelines");
  } catch (e) { toast(e.message, true); return; }
  const grid = $("#pl-grid");
  if (!state.pipelines.length) {
    grid.innerHTML = `<div class="empty">暂无流水线。把 YAML 放入 pipelines/ 目录，或点击右上角注册。</div>`;
    return;
  }
  grid.innerHTML = state.pipelines.map(p => `
    <div class="card pipeline-card">
      <h3>${esc(p.name)}</h3>
      <div class="meta">
        ${p.trigger && p.trigger.repo ? `仓库 <code>${esc(p.trigger.repo)}</code> · 事件 <code>${esc((p.trigger.events||["push"]).join(","))}</code>` : "仅手动触发"}
      </div>
      <div class="stages-flow">
        ${(p.stages||[]).map(s => `<span class="chip" title="依赖: ${esc((s.depends_on||[]).join(", ") || "无")}">${esc(s.name)} (${(s.steps||[]).length})</span>`).join(" → ")}
      </div>
      <button class="btn primary" onclick="showRunModal('${esc(p.name)}')">▶ 运行</button>
      <button class="btn danger" onclick="deletePipeline('${esc(p.name)}')">删除</button>
    </div>`).join("");
}

async function deletePipeline(name) {
  if (!confirm(`删除流水线 ${name}？`)) return;
  try {
    await api("/api/pipelines/" + encodeURIComponent(name), {method: "DELETE"});
    toast("已删除");
    renderPipelines();
  } catch (e) { toast(e.message, true); }
}

function showRunModal(name) {
  modal(`
    <h3>运行流水线 · ${esc(name)}</h3>
    <label>Git 仓库地址（可选，填写后先执行 clone 阶段）</label>
    <input id="run-repo" placeholder="https://github.com/user/repo.git">
    <label>分支（可选）</label>
    <input id="run-branch" placeholder="main">
    <div class="actions">
      <button class="btn" onclick="closeModal()">取消</button>
      <button class="btn primary" onclick="runPipeline('${esc(name)}')">开始构建</button>
    </div>`);
}

async function runPipeline(name) {
  const repo = $("#run-repo").value.trim();
  const branch = $("#run-branch").value.trim();
  try {
    const b = await api("/api/pipelines/" + encodeURIComponent(name) + "/run", {
      method: "POST",
      headers: {"Content-Type": "application/json"},
      body: JSON.stringify({repo, branch}),
    });
    closeModal();
    toast(`构建 #${b.number} 已入队`);
    location.hash = "#/builds/" + b.id;
  } catch (e) { toast(e.message, true); }
}

function showRegisterModal() {
  modal(`
    <h3>注册流水线 YAML</h3>
    <textarea id="pl-yaml" placeholder="name: my-pipeline
stages:
  - name: build
    steps:
      - name: compile
        image: golang:1.25-alpine
        commands: [go build ./...]"></textarea>
    <div class="actions">
      <button class="btn" onclick="closeModal()">取消</button>
      <button class="btn primary" onclick="registerPipeline()">注册</button>
    </div>`);
}

async function registerPipeline() {
  try {
    await api("/api/pipelines", {method: "POST", body: $("#pl-yaml").value});
    closeModal();
    toast("注册成功");
    renderPipelines();
  } catch (e) { toast(e.message, true); }
}

function modal(html) {
  closeModal();
  const mask = document.createElement("div");
  mask.className = "modal-mask";
  mask.id = "modal-mask";
  mask.innerHTML = `<div class="modal">${html}</div>`;
  mask.addEventListener("click", e => { if (e.target === mask) closeModal(); });
  document.body.appendChild(mask);
}
function closeModal() { const m = $("#modal-mask"); if (m) m.remove(); }

/* ---------- 构建详情 + 实时日志 ---------- */
async function renderBuild(id) {
  main.innerHTML = `<div class="empty">加载中…</div>`;
  await refetchBuild(id);
  openEvents(id);
}

async function refetchBuild(id) {
  try {
    state.currentBuild = await api("/api/builds/" + id);
    drawBuild();
  } catch (e) {
    main.innerHTML = `<div class="empty">构建不存在或已清理</div>`;
  }
}

function scheduleRefetch(id) {
  if (state.refetchTimer) return;
  state.refetchTimer = setTimeout(() => {
    state.refetchTimer = null;
    if (state.currentBuild) refetchBuild(id);
  }, 250);
}

function drawBuild() {
  const b = state.currentBuild;
  if (!b) return;
  const running = b.state === "running" || b.state === "pending";
  main.innerHTML = `
    <div class="build-head">
      <h2>${esc(b.pipeline)} #${b.number}</h2>
      ${badge(b.state)}
      <span class="meta">
        触发 ${esc(b.trigger)}
        ${b.branch ? " · 分支 " + esc(b.branch) : ""}
        ${b.commit ? " · <span style='font-family:var(--mono)'>" + esc(b.commit.slice(0,8)) + "</span>" : ""}
        ${b.author ? " · " + esc(b.author) : ""}
        · 耗时 ${fmtDur(b.started_at, b.ended_at)}
      </span>
      <span class="spacer" style="flex:1"></span>
      ${running ? `<button class="btn danger" onclick="cancelBuild('${b.id}')">取消构建</button>` : ""}
      <button class="btn" onclick="location.hash='#/'">返回</button>
    </div>
    ${b.error ? `<div class="card" style="padding:12px 16px;margin-bottom:16px;color:var(--red);font-size:13px">${esc(b.error)}</div>` : ""}
    ${b.message ? `<div class="card" style="padding:12px 16px;margin-bottom:16px;color:var(--text-dim);font-size:13px">${esc(b.message)}</div>` : ""}
    <div class="stage-flow">
      ${(b.stages || []).map((st, i) => `
        ${i > 0 ? '<div class="stage-node"><span class="stage-arrow">→</span></div>' : ""}
        <div class="stage-node"><div class="stage-card ${st.state}">
          <div class="stage-name">${esc(st.name)}<span class="dur">${fmtDur(st.started_at, st.ended_at)}</span></div>
          ${(st.steps || []).map(sp => `
            <div class="step-row ${state.selectedStep && state.selectedStep.stage === st.name && state.selectedStep.step === sp.name ? "selected" : ""}"
                 onclick="selectStep('${esc(st.name)}','${esc(sp.name)}')">
              <span class="s-dot ${sp.state}"></span>
              <span>${esc(sp.name)}</span>
              <span class="exit">${sp.exit_code >= 0 ? "exit " + sp.exit_code : ""}</span>
            </div>`).join("")}
        </div></div>`).join("")}
    </div>
    <div class="log-panel" id="log-panel" style="display:${state.selectedStep ? "block" : "none"}">
      <div class="log-head" id="log-head"></div>
      <div class="log-body" id="log-body"></div>
    </div>
    ${!state.selectedStep ? `<div class="log-empty">点击任意步骤查看实时日志</div>` : ""}`;
  if (state.selectedStep) loadFullLog();
}

async function selectStep(stage, step) {
  state.selectedStep = {stage, step};
  drawBuild();
}

async function loadFullLog() {
  const b = state.currentBuild, sel = state.selectedStep;
  if (!b || !sel) return;
  $("#log-head").textContent = `${sel.stage} / ${sel.step}`;
  try {
    const text = await api(`/api/builds/${b.id}/logs?stage=${encodeURIComponent(sel.stage)}&step=${encodeURIComponent(sel.step)}`);
    const body = $("#log-body");
    if (body) {
      body.textContent = text || "（暂无日志）";
      body.scrollTop = body.scrollHeight;
    }
  } catch {}
}

function appendLogLine(stage, step, line) {
  const sel = state.selectedStep;
  if (!sel || sel.stage !== stage || sel.step !== step) return;
  const body = $("#log-body");
  if (!body) return;
  if (body.textContent === "（暂无日志）") body.textContent = "";
  const atBottom = body.scrollTop + body.clientHeight >= body.scrollHeight - 30;
  body.textContent += line + "\n";
  if (atBottom) body.scrollTop = body.scrollHeight;
}

function openEvents(id) {
  const es = new EventSource(`/api/builds/${id}/events`);
  state.evt = es;
  es.onmessage = (m) => {
    let ev;
    try { ev = JSON.parse(m.data); } catch { return; }
    switch (ev.type) {
      case "snapshot":
        state.currentBuild = ev.build;
        drawBuild();
        break;
      case "log":
        appendLogLine(ev.stage, ev.step, ev.line);
        break;
      case "build": case "stage": case "step":
        scheduleRefetch(id);
        break;
      case "done":
        scheduleRefetch(id);
        es.close();
        state.evt = null;
        break;
    }
  };
}

async function cancelBuild(id) {
  try {
    await api(`/api/builds/${id}/cancel`, {method: "POST"});
    toast("已请求取消");
  } catch (e) { toast(e.message, true); }
}

/* ---------- 健康检查 ---------- */
async function health() {
  const el = $("#health");
  try {
    await api("/api/health");
    el.classList.add("ok");
    $("#health-text").textContent = "服务正常";
  } catch {
    el.classList.remove("ok");
    $("#health-text").textContent = "服务不可达";
  }
}
setInterval(health, 15000);

health();
router();
</script>
